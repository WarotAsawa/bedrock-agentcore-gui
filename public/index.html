<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentCore Console — Sign In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-body:#f4f6f9;--bg-card:#ffffff;
  --border-color:#e2e8f0;--border-hover:#cbd5e1;
  --primary:#1e40af;--primary-light:#3b82f6;--primary-lighter:#dbeafe;
  --text-primary:#1e293b;--text-secondary:#475569;--text-muted:#94a3b8;
  --input-bg:#ffffff;--input-border:#e2e8f0;--input-border-focus:#3b82f6;
  --font-display:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius-sm:6px;--radius-md:10px;--radius-lg:18px;
}
html,body{width:100%;height:100%;font-family:var(--font-display);background:var(--bg-body);color:var(--text-primary)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}

.login-container{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}

.login-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:44px 40px 40px;box-shadow:0 4px 24px rgba(0,0,0,0.06);animation:cardAppear .5s ease-out}
@keyframes cardAppear{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.logo-section{text-align:center;margin-bottom:36px}
.logo-icon{width:56px;height:56px;margin:0 auto 16px;border-radius:14px;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(30,64,175,0.2)}
.logo-icon svg{width:28px;height:28px}
.logo-title{font-size:22px;font-weight:700;letter-spacing:-0.03em;color:var(--primary)}
.logo-subtitle{font-size:12px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px}

.form-group{margin-bottom:20px}
.form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-secondary);margin-bottom:8px}
.form-input{width:100%;padding:12px 16px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-display);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:var(--input-border-focus);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.form-input::placeholder{color:var(--text-muted)}

.login-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:0.02em;cursor:pointer;transition:all .3s;margin-top:8px}
.login-btn:hover{background:var(--primary-light);box-shadow:0 4px 16px rgba(30,64,175,0.25)}
.login-btn:active{transform:translateY(0)}

.error-msg{display:none;margin-top:16px;padding:10px 14px;border-radius:var(--radius-sm);background:#fee2e2;border:1px solid #fecaca;color:#dc2626;font-size:12px;text-align:center;animation:shake .4s ease-out}
.error-msg.visible{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.footer-text{text-align:center;margin-top:24px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
          <line x1="12" y1="22" x2="12" y2="15.5"/>
          <polyline points="22 8.5 12 15.5 2 8.5"/>
        </svg>
      </div>
      <div class="logo-title">AgentCore Console</div>
      <div class="logo-subtitle">Bedrock Runtime GUI</div>
    </div>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="username" type="text" placeholder="Enter username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button class="login-btn" type="submit">Sign In</button>
      <div class="error-msg" id="error-msg">Invalid credentials. Please try again.</div>
    </form>

    <div class="footer-text">Bedrock AgentCore · Secure Access</div>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  }).then(r => {
    if (r.ok) {
      window.location.href = '/chat.html';
    } else {
      const err = document.getElementById('error-msg');
      err.classList.add('visible');
      setTimeout(() => err.classList.remove('visible'), 3000);
    }
  });
  return false;
}

// If already authenticated, redirect
fetch('/api/me').then(r => { if (r.ok) window.location.href = '/chat.html'; });
</script>
</body>
</html>
