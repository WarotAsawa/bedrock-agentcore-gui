<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentCore Console — Sign In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#06080f;--bg-card:rgba(14,19,36,0.65);
  --glass-border:rgba(100,180,255,0.08);--glass-border-hover:rgba(100,180,255,0.18);
  --aurora-cyan:#00e5ff;--aurora-teal:#0ff5c8;--aurora-violet:#8b5cf6;
  --aurora-magenta:#d946ef;--aurora-green:#22d3a7;
  --text-primary:#e8edf5;--text-secondary:#8892a8;--text-muted:#505a72;
  --input-bg:rgba(10,14,30,0.7);--input-border:rgba(100,180,255,0.12);
  --input-border-focus:rgba(0,229,255,0.45);
  --btn-gradient:linear-gradient(135deg,#00e5ff 0%,#0ff5c8 40%,#22d3a7 100%);
  --font-display:'Outfit',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius-sm:8px;--radius-md:14px;--radius-lg:22px;
}
html,body{width:100%;height:100%;font-family:var(--font-display);background:var(--bg-deep);color:var(--text-primary)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative}

.aurora-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora-bg::before{content:'';position:absolute;top:-40%;left:-20%;width:140%;height:140%;background:radial-gradient(ellipse 900px 600px at 15% 20%,rgba(0,229,255,0.12) 0%,transparent 60%),radial-gradient(ellipse 700px 500px at 80% 15%,rgba(139,92,246,0.1) 0%,transparent 55%),radial-gradient(ellipse 600px 400px at 50% 80%,rgba(217,70,239,0.06) 0%,transparent 50%),radial-gradient(ellipse 500px 300px at 20% 70%,rgba(34,211,167,0.07) 0%,transparent 50%);animation:auroraShift 20s ease-in-out infinite alternate}
.aurora-bg::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");opacity:.4}
@keyframes auroraShift{0%{opacity:1;transform:translate(0,0) scale(1)}50%{opacity:.85;transform:translate(2%,-1%) scale(1.02)}100%{opacity:.95;transform:translate(-1%,1%) scale(1)}}

.login-container{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}

.login-card{background:var(--bg-card);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:44px 40px 40px;box-shadow:0 24px 80px rgba(0,0,0,0.4),0 0 60px rgba(0,229,255,0.04);animation:cardAppear .6s ease-out}
@keyframes cardAppear{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.logo-section{text-align:center;margin-bottom:36px}
.logo-icon{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,var(--aurora-cyan),var(--aurora-violet));display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,229,255,0.2)}
.logo-icon svg{width:28px;height:28px}
.logo-title{font-size:22px;font-weight:700;letter-spacing:-0.03em;background:linear-gradient(135deg,var(--aurora-cyan),var(--text-primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-subtitle{font-size:12px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px}

.form-group{margin-bottom:20px}
.form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-secondary);margin-bottom:8px}
.form-input{width:100%;padding:12px 16px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-display);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:var(--input-border-focus);box-shadow:0 0 0 3px rgba(0,229,255,0.08)}
.form-input::placeholder{color:var(--text-muted)}

.login-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:var(--btn-gradient);color:#06080f;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:0.02em;cursor:pointer;transition:all .3s;margin-top:8px}
.login-btn:hover{box-shadow:0 0 30px rgba(0,229,255,0.3);transform:translateY(-1px)}
.login-btn:active{transform:translateY(0)}

.error-msg{display:none;margin-top:16px;padding:10px 14px;border-radius:var(--radius-sm);background:rgba(255,90,90,0.1);border:1px solid rgba(255,90,90,0.2);color:#ff5a5a;font-size:12px;text-align:center;animation:shake .4s ease-out}
.error-msg.visible{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.footer-text{text-align:center;margin-top:24px;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
</style>
</head>
<body>

<div class="aurora-bg"></div>

<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
          <line x1="12" y1="22" x2="12" y2="15.5"/>
          <polyline points="22 8.5 12 15.5 2 8.5"/>
        </svg>
      </div>
      <div class="logo-title">AgentCore Console</div>
      <div class="logo-subtitle">Bedrock Runtime GUI</div>
    </div>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="username" type="text" placeholder="Enter username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button class="login-btn" type="submit">Sign In</button>
      <div class="error-msg" id="error-msg">Invalid credentials. Please try again.</div>
    </form>

    <div class="footer-text">Bedrock AgentCore · Secure Access</div>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  }).then(r => {
    if (r.ok) {
      window.location.href = '/chat.html';
    } else {
      const err = document.getElementById('error-msg');
      err.classList.add('visible');
      setTimeout(() => err.classList.remove('visible'), 3000);
    }
  });
  return false;
}

// If already authenticated, redirect
fetch('/api/me').then(r => { if (r.ok) window.location.href = '/chat.html'; });
</script>
</body>
</html>
